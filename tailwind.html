<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Lesson 1: Color, Padding, Margin and Text -->
    <div class="bg-orange-500 p-8 m-10">
      <p class="text-orange-100 text-sm font-bold">LIMITED TIME OFFER</p>
      <h2 class="text-white text-5xl font-bold mt-5">Pizza Party</h2>
      <p class="text-orange-200 text-lg mt-6">Buy 1 get 1 free</p>
      <p class="text-yellow-300">Only ₹900</p>
      <button class="bg-white font-bold px-6 py-3">order now</button>
    </div>

    <!-- Lesson 2: Width, Height, Border & Shadow -->
    <div class="mx-auto max-w-sm">
      <div class="bg-orange-200 py-8 text-center text-7xl">🍕</div>
      <div class="p-6">
        <span
          class="bg-red-600 px-3 py-1 text-xs font-bold text-white Shadow-lg rounded-lg"
          >SALE
        </span>
        <h3 class="mt-3 text-xl font-bold text-slate-900">
          Cheese Burst Pizza
        </h3>
        <p class="mt-2 text-slate-600">Extra cheese</p>
        <p class="mt-4 text-2xl font-bold text-orange-700">₹900</p>
        <button
          class="bg-orange-700 px-4 py-3 font-bold text-white mt-4 w-full Shadow-lg rounded-2xl"
        >
          Add to cart
        </button>
      </div>
    </div>
  </body>
</html>
